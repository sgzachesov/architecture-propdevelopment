# Сетевые политики для разграничения трафика внутри namespace.
#
# Разрешено двустороннее взаимодействие только внутри пар:
#   front-end        <-> back-end-api
#   admin-front-end  <-> admin-back-end-api
# Любой другой трафик к этим подам (и от них) запрещён.
#
# Применение: kubectl apply -f non-admin-api-allow.yaml

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: non-admin-api-allow
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values:
          - front-end
          - back-end-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - front-end
                  - back-end-api
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - front-end
                  - back-end-api
      ports:
        - protocol: TCP
          port: 80
    # DNS (нужен для разрешения имён сервисов)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-api-allow
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values:
          - admin-front-end
          - admin-back-end-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - admin-front-end
                  - admin-back-end-api
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - admin-front-end
                  - admin-back-end-api
      ports:
        - protocol: TCP
          port: 80
    # DNS (нужен для разрешения имён сервисов)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53